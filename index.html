<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>눈멍 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 전체 화면 3D 장면 + 왼쪽 아래 조이스틱 + 오른쪽 아래 행동 버튼. 밤 하나의 분위기로 고정. */
:root{
  color-scheme: dark;
  --night:#070d22;
  --ink:#eaf1ff;
  --ink2:#a9b9dc;
  --panel:rgba(12,20,44,.74);
  --line:rgba(190,210,255,.24);
  --warm:#ffcf7a;
  --coral:#ff8a78;
  --font-d:'Gowun Batang',Georgia,serif;
  --font-b:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--font-b);position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:absolute;inset:0}
#gl{display:block;width:100%;height:100%}
#touch{position:absolute;inset:0;touch-action:none}
#splats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.splat{position:absolute;inset:0;animation:melt 4.4s ease-in forwards}
@keyframes melt{0%{opacity:.96;transform:translateY(0)}60%{opacity:.8}100%{opacity:0;transform:translateY(70px)}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 58%,rgba(3,6,18,.45) 100%)}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-top:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.brand h1{font:700 21px var(--font-d);margin:0;letter-spacing:.04em}
.stat{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font:13px var(--font-b);cursor:pointer;min-height:34px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chip{white-space:nowrap}
.chip:focus-visible,.act:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
.chip.on{background:var(--warm);color:#2a1d05;border-color:transparent}
.chip.del{color:#ffb4a8}
#joyZone{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:30px;width:120px;height:120px;border-radius:50%;border:2px dashed rgba(190,210,255,.22);pointer-events:none;transition:opacity .2s}
#joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid var(--line);background:rgba(12,20,44,.35);pointer-events:none;opacity:0;transition:opacity .15s}
#jk{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(244,248,255,.6)}
.acts{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:22px;display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
.act{pointer-events:auto;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 15px var(--font-b);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bThrow{width:92px;height:92px;border-radius:50%;background:rgba(244,248,255,.2);box-shadow:inset 0 -3px 0 var(--warm);font-size:16px}
#bThrow:active{background:rgba(244,248,255,.38)}
#bRoll{border-radius:999px;padding:11px 18px}
.row{display:flex;gap:12px;align-items:flex-end}
.act{touch-action:none}
#bBlock{position:relative;overflow:hidden;width:72px;height:72px;border-radius:50%;font-size:15px}
#bBlock.on{background:rgba(160,205,255,.5);border-color:#bfe0ff}
.bar{position:absolute;left:14px;right:14px;bottom:10px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);overflow:hidden}
.bar b{display:block;height:100%;width:100%;background:var(--warm)}
#warn{position:absolute;width:44px;height:44px;pointer-events:none;filter:drop-shadow(0 0 8px rgba(255,138,120,.9));animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
#bRoll[aria-pressed="true"]{background:var(--warm);color:#2a1d05;border-color:transparent}
.tray{position:absolute;left:50%;transform:translateX(-50%);bottom:168px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(94%,420px);pointer-events:none}
.tray .chip{pointer-events:auto}
.toast{position:absolute;top:96px;left:50%;transform:translate(-50%,-6px);background:rgba(244,248,255,.95);color:#1a2340;padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;max-width:min(88%,360px);text-align:center;word-break:keep-all}
.toast.on{opacity:1;transform:translate(-50%,0)}
#intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(86%,340px);text-align:center;background:rgba(8,14,34,.72);border:1px solid var(--line);border-radius:16px;padding:16px 18px;font-size:14px;line-height:1.6;word-break:keep-all;transition:opacity .8s;pointer-events:none}
#intro b{font-family:var(--font-d);font-size:18px;display:block;margin-bottom:6px}
#fail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:15px}
[hidden]{display:none!important}
@media (max-width:380px){.brand h1{font-size:19px}}
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<div id="stage"><canvas id="gl" aria-label="눈 내리는 밤 마당 3D 장면"></canvas></div>
<div id="touch"></div>
<div id="splats"></div>
<div class="vig"></div>
<div id="joyZone"></div>
<div id="joy"><div id="jk"></div></div>

<header class="top">
  <div class="brand">
    <h1>눈멍 3D</h1>
    <div class="stat"><span class="pill" id="net" hidden></span><span class="pill" id="score">명중 0 · 막음 0 · 맞음 0</span><button class="chip" id="bNick" type="button" aria-label="별명 바꾸기"></button></div>
  </div>
  <button class="chip" id="bSnd" type="button">소리 켜기</button>
</header>

<div class="tray" id="tray" hidden></div>
<div class="toast" id="toast" role="status"></div>

<div class="acts">
  <button class="act" id="bRoll" type="button" aria-pressed="false">눈 굴리기</button>
  <div class="row">
    <button class="act" id="bBlock" type="button" aria-label="누르고 있는 동안 눈방패">막기<i class="bar"><b id="bEn"></b></i></button>
    <button class="act" id="bThrow" type="button">던지기</button>
  </div>
</div>
<div id="warn" hidden><svg viewBox="0 0 44 44"><path d="M22 4 L40 38 L22 30 L4 38 Z" fill="#ff8a78" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg></div>

<div id="intro"><b>첫눈 내리는 밤 마당</b>왼쪽을 끌면 걸어요. 오른쪽을 끌면 시점이 돌아가요.<br>화면을 톡 치면 그쪽으로 눈덩이를 던져요.<br>날아오는 눈덩이를 톡 치면 부서지고, 막기를 누르고 있으면 눈방패가 나와요.</div>
<div id="fail">이 기기에서는 3D 화면을 켤 수 없어요.<br>다른 브라우저에서 열어주세요.</div>

  try{touch.setPointerCapture(e.pointerId);}catch(_){}
  if(AC&&AC.state==='suspended'&&soundOn)AC.resume();
  const r=touch.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;

touch.addEventListener('pointermove',e=>{
  const r=touch.getBoundingClientRect();
  if(joy&&e.pointerId===joy.id){
    joy.mv=Math.max(joy.mv,Math.hypot(e.clientX-joy.sx,e.clientY-joy.sy));
    let dx=e.clientX-r.left-joy.ox,dy=e.clientY-r.top-joy.oy;const len=Math.hypot(dx,dy),mx=46;

    look.mv=Math.max(look.mv,Math.hypot(e.clientX-look.sx,e.clientY-look.sy));
    camYaw-=(e.clientX-look.lx)*.0065;camPitch=clamp(camPitch+(e.clientY-look.ly)*.004,.05,.95);look.lx=e.clientX;look.ly=e.clientY;

let cd=0,shake=0;
const shield={on:false,en:100,lock:0};
function setShield(on){

  shield.on=on;me.shield=on;bBlock.classList.toggle('on',on);send({t:'sh',i:myId,on:on?1:0});

function toScreen(v){const q=v.clone().project(cam);return{x:(q.x*.5+.5)*CW,y:(-q.y*.5+.5)*CH,z:q.z};}
function blockProj(i){
  const by=projs[i].owner;endProj(i);sBlk++;score();sndBlock();toast('탁! 막았어요');
  if(by&&by.indexOf('bot')!==0)send({t:'bk',i:myId,by});
}
function smashAt(x,y){
  let bi=-1,bd=64;
  for(let i=0;i<projs.length;i++){
    const p=projs[i];if(p.owner===myId)continue;
    const dx=me.pos.x-p.m.position.x,dz=me.pos.z-p.m.position.z;
    if(dx*dx+dz*dz>324||dx*p.v.x+dz*p.v.z<=0)continue;
    const sc=toScreen(p.m.position);if(sc.z>1)continue;
    const d=Math.hypot(sc.x-x,sc.y-y);if(d<bd){bd=d;bi=i;}
  }
  if(bi<0)return false;
  blockProj(bi);return true;
}
function leadTarget(k){
  const dist=Math.hypot(k.pos.x-me.pos.x,k.pos.z-me.pos.z),t=dist/12;
  let vx=k.vx||0,vz=k.vz||0;
  if(k.bot&&k.moving){const dx=k.tx-k.pos.x,dz=k.tz-k.pos.z,l=Math.hypot(dx,dz)||1;vx=dx/l*1.7;vz=dz/l*1.7;}
  return new V3(k.pos.x+vx*t,1.15,k.pos.z+vz*t);
}
function pickTarget(x,y){
  let best=null,bd=75;
  for(const k of [...bots.filter(b=>b.active),...others.values()]){
    const sc=toScreen(new V3(k.pos.x,1.0,k.pos.z));if(sc.z>1)continue;
    const d=Math.hypot(sc.x-x,sc.y-y);if(d<bd){bd=d;best=k;}
  }
  if(best)return leadTarget(best);
  const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(x/CW*2-1,-(y/CH)*2+1),cam);
  const o=ray.ray.origin,d=ray.ray.direction;
  if(d.y<-.02){const t=(.3-o.y)/d.y;return o.clone().addScaledVector(d,t);}
  return o.clone().addScaledVector(d,24);
}
function tapAt(x,y){
  if(rolling||shield.on)return;
  if(smashAt(x,y))return;
  throwAt(pickTarget(x,y));
}
function doThrow(){
  if(rolling){toast('눈덩이를 먼저 내려놓아요');return;}
  const f=new V3(Math.sin(camYaw),0,Math.cos(camYaw));
  let best=null,bd=1e9;
  for(const k of [...bots.filter(b=>b.active),...others.values()]){
    const dx=k.pos.x-me.pos.x,dz=k.pos.z-me.pos.z,d=Math.hypot(dx,dz);
    if(d<2.5||d>26)continue;
    if(Math.abs(angDiff(camYaw,Math.atan2(dx,dz)))>.95)continue;
    if(d<bd){bd=d;best=k;}
  }
  throwAt(best?leadTarget(best):new V3(me.pos.x+f.x*13,.3,me.pos.z+f.z*13));
}
function throwAt(tgt){
  if(cd>0)return;
  if(rolling){toast('눈덩이를 먼저 내려놓아요');return;}
  cd=.45;
  let dx=tgt.x-me.pos.x,dz=tgt.z-me.pos.z,d=Math.hypot(dx,dz)||.01;
  if(d>24){dx*=24/d;dz*=24/d;d=24;}
  const yaw=Math.atan2(dx,dz),f=new V3(Math.sin(yaw),0,Math.cos(yaw));
  const start=new V3(me.pos.x+f.x*.45,1.45,me.pos.z+f.z*.45);
  const v=15,g=9.8,dy=tgt.y-start.y,D=Math.max(.5,d-.45);
  const disc=v*v*v*v-g*(g*D*D+2*dy*v*v);
  let th=disc>0?Math.atan((v*v-Math.sqrt(disc))/(g*D)):.7;th=clamp(th,-.2,1);
  const vel=new V3(f.x*Math.cos(th)*v,Math.sin(th)*v,f.z*Math.cos(th)*v);
  me.ry=yaw;me.ryT=yaw;me.throwT=1;
  fire(myId,start,vel);sndThrow();
  send({t:'th',i:myId,x:+start.x.toFixed(2),y:+start.y.toFixed(2),z:+start.z.toFixed(2),vx:+vel.x.toFixed(2),vy:+vel.y.toFixed(2),vz:+vel.z.toFixed(2)});
}

/* ---------- 봇 (혼자일 때 꼬마 친구) ---------- */
function mkBot(i){
  const k=makeKid((i*2+1)%PAL.length);k.bot=true;k.id='bot'+i;setKidName(k,'동네 꼬마');
  k.pos.set(R(-12,12),0,R(-12,12));k.tx=k.pos.x;k.tz=k.pos.z;k.wait=R(0,2);k.next=R(3,6)+i*1.5;k.active=true;return k;
}
for(let i=0;i<3;i++)bots.push(mkBot(i));
function setBots(n){bots.forEach((b,i)=>{b.active=i<n;b.g.visible=i<n;});}
const randPoint=()=>{for(let t=0;t<10;t++){const a=R(0,PI2),r=Math.sqrt(Math.random())*22,x=Math.cos(a)*r,z=Math.sin(a)*r;if(!colliders.some(c=>Math.hypot(c.x-x,c.z-z)<c.r+1.2))return{x,z};}return{x:0,z:5};};
function updateBot(b,dt){
  const dx=b.tx-b.pos.x,dz=b.tz-b.pos.z,d=Math.hypot(dx,dz);
  if(d>.3&&b.wind<=0){const sp=Math.min(1.7*dt,d);b.pos.x+=dx/d*sp;b.pos.z+=dz/d*sp;b.ryT=Math.atan2(dx,dz);b.moving=true;}
  else{b.moving=false;if(b.wind<=0){b.wait-=dt;if(b.wait<=0){const p=randPoint();b.tx=p.x;b.tz=p.z;b.wait=R(1.5,4);}}}
  b.next-=dt;
  if(b.next<=0&&b.wind<=0&&Math.hypot(me.pos.x-b.pos.x,me.pos.z-b.pos.z)<30){b.wind=.7;b.moving=false;say(b,pick(WINDSAY));b.releasing=true;}
  if(b.releasing&&b.wind<=.12){
    b.releasing=false;b.next=R(4,8);
    const ddx=me.pos.x-b.pos.x,ddz=me.pos.z-b.pos.z,dist=Math.hypot(ddx,ddz),v=14;
    const a=.5*Math.asin(clamp(9.8*dist/(v*v),0,1))||.2;
    const yaw=Math.atan2(ddx,ddz)+R(-.08,.08),aa=Math.min(a+R(-.04,.04),.9);
    const start=new V3(b.pos.x+Math.sin(yaw)*.45,1.4,b.pos.z+Math.cos(yaw)*.45);
    fire(b.id,start,new V3(Math.sin(yaw)*Math.cos(aa)*v,Math.sin(aa)*v,Math.cos(yaw)*Math.cos(aa)*v));
    b.ryT=yaw;b.throwT=1;
  }
  if(b.wind>0)b.ryT=Math.atan2(me.pos.x-b.pos.x,me.pos.z-b.pos.z);
  b.ry+=angDiff(b.ry,b.ryT)*Math.min(1,dt*8);
}

/* ---------- 온라인: 서버 없이 브라우저끼리(WebRTC) / 키가 있으면 Supabase ---------- */
const AUTO=!params.get('room');
let roomN=AUTO?1:((params.get('room')||'1').replace(/[^\w-]/g,'').slice(0,20)||'1');
const MAXP=8;
const VIA=params.get('via')==='torrent'?'torrent':'nostr';
const USE_SB=!!(SUPABASE_URL&&SUPABASE_KEY);
let ch=null,sb=null,online=false,joined=false,netSend=null,p2pRoom=null,capT=null;
const peerMap=new Map();
const netEl=$('#net');
function setNet(s){
  if(s==='solo'){netEl.hidden=true;return;}
  netEl.hidden=false;
  netEl.textContent=s==='on'?(others.size?'지금 '+(1+others.size)+'명':'친구를 기다리는 중'):s==='conn'?'연결 중…':'혼자 놀이 중';
}
function send(p,target){if(netSend)netSend(p,target);}
const myState=()=>({c:myCi,x:+me.pos.x.toFixed(1),z:+me.pos.z.toFixed(1),n:myName});
function track(){if(ch&&online){try{ch.track(myState());}catch(_){}}}
function mkRemote(id,m){
  const k=makeKid(m.c|0);k.id=id;k.remote=true;k.pos.set(+m.x||0,0,+m.z||0);k.tx=k.pos.x;k.tz=k.pos.z;k.tt=performance.now();k.rb=0;
  setKidName(k,validName(m.n)?m.n:'눈꼬마');return k;
}
function addRemote(id,m){
  let k=others.get(id);
  if(!k){k=mkRemote(id,m);others.set(id,k);}
  else if(validName(m.n)&&k.name!==m.n)setKidName(k,m.n);
  return k;
}
function removeRemote(id){const k=others.get(id);if(!k)return;scene.remove(k.g);if(k.ball)scene.remove(k.ball);others.delete(id);}
function afterPeers(){humansN=1+others.size;setBots(Math.max(0,3-humansN));setNet('on');}
function nameOf(id){
  if(id===myId)return myName;
  const k=others.get(id);if(k)return k.name;
  return id&&id.indexOf('bot')===0?'동네 꼬마':'누군가';
}
function honor(id){const n=nameOf(id);return id&&id.indexOf('bot')===0?n:n+' 님';}
function snapFor(newId,pid){
  const all=[myId,...others.keys()].filter(x=>x!==newId).sort();
  if(all[0]===myId)send({t:'snap',to:newId,men:[...men.values()].map(manData)},pid);
}
function leaveNet(){
  clearTimeout(capT);
  try{if(ch&&sb)sb.removeChannel(ch);}catch(_){}ch=null;
  try{if(p2pRoom)p2pRoom.leave();}catch(_){}p2pRoom=null;
  online=false;netSend=null;joined=false;peerMap.clear();
  for(const id of [...others.keys()])removeRemote(id);
}
function switchRoom(n){roomN=n;leaveNet();connect();}
function scheduleCap(){
  clearTimeout(capT);
  capT=setTimeout(()=>{if(AUTO&&others.size>=MAXP&&roomN<8)switchRoom(roomN+1);},5000);
}
/* --- 서버 없이: 브라우저끼리 직접 연결 (신호 교환은 공개 릴레이, 게임 데이터는 P2P) --- */
function connectP2P(){
  const lib=window.__trystero&&window.__trystero[VIA];
  if(!lib){setNet('solo');return false;}
  setNet('conn');
  try{
    p2pRoom=lib.joinRoom({appId:'nunmeong-snow-3d-v1',rtcConfig:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:'stun:stun.cloudflare.com:3478'}]}},'yard-'+roomN);
    const act=p2pRoom.makeAction('g');
    netSend=(p,target)=>{try{if(target)act.send(p,{target});else act.send(p);}catch(_){}};
    p2pRoom.onPeerJoin=pid=>{netSend({t:'meet',i:myId,c:myCi,n:myName,x:+me.pos.x.toFixed(1),z:+me.pos.z.toFixed(1)},pid);};
    p2pRoom.onPeerLeave=pid=>{const gid=peerMap.get(pid);if(gid)removeRemote(gid);peerMap.delete(pid);afterPeers();};
    act.onMessage=(d,info)=>{
      if(!d||typeof d!=='object')return;
      const pid=info&&info.peerId;
      if(d.t==='meet'){
        if(typeof d.i!=='string'||d.i===myId)return;
        peerMap.set(pid,d.i);const isNew=!others.has(d.i);addRemote(d.i,d);afterPeers();
        if(isNew)snapFor(d.i,pid);
      }else onMsg(d);
    };
    online=true;setNet('on');scheduleCap();
    return true;
  }catch(e){setNet('solo');return false;}
}
/* --- (선택) Supabase Realtime: 위쪽 두 줄에 키를 넣으면 이쪽으로 연결 --- */
function syncPeers(){
  if(!ch)return;
  const st=ch.presenceState(),keysP=Object.keys(st);
  for(const key of keysP){if(key===myId)continue;const m=st[key][0];if(m)addRemote(key,m);}
  for(const id of [...others.keys()])if(!st[id])removeRemote(id);
  afterPeers();
  if(!joined){
    joined=true;
    if(AUTO&&keysP.length>MAXP&&roomN<8){switchRoom(roomN+1);return;}
    if(others.size>0)send({t:'hi',i:myId});
  }
}
function connectSB(){
  if(!window.supabase){setNet('solo');return false;}
  try{
    if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{realtime:{params:{eventsPerSecond:12}}});
    setNet('conn');
    const c=sb.channel('nunmeong3d-'+roomN,{config:{broadcast:{self:false},presence:{key:myId}}});ch=c;
    netSend=p=>{if(online&&ch===c){try{c.send({type:'broadcast',event:'g',payload:p});}catch(_){}}};
    c.on('presence',{event:'sync'},syncPeers);
    c.on('broadcast',{event:'g'},m=>onMsg((m&&m.payload)||{}));
    c.subscribe(status=>{
      if(c!==ch)return;
      if(status==='SUBSCRIBED'){online=true;track();}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){online=false;setNet('solo');}
    });
    return true;
  }catch(e){setNet('solo');return false;}
}
function connect(){
  const ok=USE_SB?connectSB():connectP2P();
  if(!ok){setBots(3);ensureStarter();}
  else{setBots(3);setTimeout(()=>{if(!others.size)ensureStarter();},4000);}
}
function onMsg(p){
  if(p.t==='p'){
    const k=others.get(p.i);if(!k)return;
    k.tx=+p.x||0;k.tz=+p.z||0;k.vx=+p.vx||0;k.vz=+p.vz||0;k.ryT=+p.r||0;k.tt=performance.now();k.rb=+p.b||0;
  }else if(p.t==='th'){
    const k=others.get(p.i);if(k){k.throwT=1;k.ryT=Math.atan2(+p.vx,+p.vz);}
    fire(p.i,new V3(+p.x,+p.y,+p.z),new V3(+p.vx,+p.vy,+p.vz));
  }else if(p.t==='got'){
    const k=others.get(p.i);if(k)reactKid(k);
    if(p.by===myId){sHit++;score();toast('명중! '+(k?honor(p.i):''));sndHit();}
  }else if(p.t==='bk'){
    const k=others.get(p.i);if(k)say(k,'막았다!');
    if(p.by===myId)toast((k?honor(p.i):'상대')+'이 막았어요');
  }else if(p.t==='sh'){
    const k=others.get(p.i);if(k)k.shield=!!p.on;
  }else if(p.t==='nm'){
    const k=others.get(p.i);if(k&&validName(p.n))setKidName(k,p.n);
  }else if(p.t==='sm'){
    const m=upsertMan(p.m);if(m&&selMan&&selMan.id===m.id)refreshTray();
  }else if(p.t==='smd'){
    if(selMan&&selMan.id===p.id){selMan=null;refreshTray();}removeMan(p.id);
  }else if(p.t==='hi'){
    snapFor(p.i);
  }else if(p.t==='snap'){
    if(p.to===myId&&Array.isArray(p.men))p.men.forEach(o=>{if(!men.has(o.id))upsertMan(o);});
  }
}
let starterDone=false;
function ensureStarter(){
  if(starterDone||men.size)return;starterDone=true;
  const m=upsertMan({id:'starter',o:'sys',x:6,z:-7,ry:Math.atan2(-6,7),p:[1,.72,.5],d:[1,1,1,1,1,1]});
  if(m)send({t:'sm',m:manData(m)});
}
let pT=0,pMoving=false;
function updateNet(dt){
  pT+=dt;
  if(pT>.3){
    pT=0;const mv=me.speed>.05||!!rolling;
    if(mv||pMoving){send({t:'p',i:myId,x:+me.pos.x.toFixed(2),z:+me.pos.z.toFixed(2),r:+me.ry.toFixed(2),vx:+me.vx.toFixed(2),vz:+me.vz.toFixed(2),b:rolling?+rolling.r.toFixed(2):0});pMoving=mv;}
  }
  const now=performance.now();
  for(const k of others.values()){
    const age=Math.min(.6,(now-k.tt)/1000);
    const px=k.tx+k.vx*age,pz=k.tz+k.vz*age,f=1-Math.exp(-10*dt);
    const ox=k.pos.x,oz=k.pos.z;
    k.pos.x=lerp(k.pos.x,px,f);k.pos.z=lerp(k.pos.z,pz,f);
    k.moving=Math.hypot(k.pos.x-ox,k.pos.z-oz)/Math.max(dt,.001)>.5;
    k.rollr=k.rb>0;
    k.ry+=angDiff(k.ry,k.ryT)*Math.min(1,dt*10);
    if(k.rb>0){
      if(!k.ball){k.ball=new THREE.Mesh(GS.sph,rollMat);scene.add(k.ball);}
      const fx=Math.sin(k.ry),fz=Math.cos(k.ry);
      k.ball.scale.setScalar(k.rb);k.ball.position.set(k.pos.x+fx*(k.rb+.8),k.rb,k.pos.z+fz*(k.rb+.8));k.ball.visible=true;
    }else if(k.ball)k.ball.visible=false;
  }
}

/* ---------- 갱신 ---------- */
const warnEl=$('#warn');
function updateWarn(){
  let best=null,bd=1e9;
  for(const p of projs){
    if(p.owner===myId)continue;
    const dx=p.m.position.x-me.pos.x,dz=p.m.position.z-me.pos.z,d=Math.hypot(dx,dz);
    if(d>20||dx*p.v.x+dz*p.v.z>=0)continue;
    if(d<bd){bd=d;best={dx,dz};}
  }
  if(!best){warnEl.hidden=true;return;}
  const a=angDiff(camYaw,Math.atan2(best.dx,best.dz));
  if(Math.abs(a)<.5){warnEl.hidden=true;return;}
  const th=-a,rad=Math.min(CW,CH)*.36;
  warnEl.hidden=false;warnEl.style.left=(CW/2+Math.sin(th)*rad)+'px';warnEl.style.top=(CH*.46-Math.cos(th)*rad)+'px';
  warnEl.style.transform='translate(-50%,-50%) rotate('+th+'rad)';
}
let tm=0,stepD=0,decorT=0;
function update(dt){
  tm+=dt;cd=Math.max(0,cd-dt);shake=Math.max(0,shake-dt*2);
  // 입력 → 이동
  let ix=joyV.x+((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0);
  let iy=joyV.y+((keys.KeyW||keys.ArrowUp)?1:0)-((keys.KeyS||keys.ArrowDown)?1:0);
  if(keys.KeyQ)camYaw+=dt*1.8;if(keys.KeyE)camYaw-=dt*1.8;
  const mag=Math.min(1,Math.hypot(ix,iy));
  const fx=Math.sin(camYaw),fz=Math.cos(camYaw);
  let mvx=0,mvz=0;
  if(mag>.05){const dx=fx*iy+(-fz)*ix,dz=fz*iy+fx*ix,l=Math.hypot(dx,dz)||1;const sp=(rolling?2.7:shield.on?2.6:4.4)*mag;mvx=dx/l*sp;mvz=dz/l*sp;}
  me.vx=lerp(me.vx,mvx,Math.min(1,dt*10));me.vz=lerp(me.vz,mvz,Math.min(1,dt*10));
  me.speed=Math.hypot(me.vx,me.vz);me.moving=me.speed>.3;me.rollr=!!rolling;
  const ox=me.pos.x,oz=me.pos.z;
  me.pos.x+=me.vx*dt;me.pos.z+=me.vz*dt;
  const cols=colliders.concat([...men.values()].map(m=>({x:m.x,z:m.z,r:m.p[0]*.92})));
  for(const c of cols){const dx=me.pos.x-c.x,dz=me.pos.z-c.z,d=Math.hypot(dx,dz),mn=c.r+.4;if(d<mn&&d>.001){me.pos.x=c.x+dx/d*mn;me.pos.z=c.z+dz/d*mn;}}
  const rr=Math.hypot(me.pos.x,me.pos.z);if(rr>38){me.pos.x*=38/rr;me.pos.z*=38/rr;}
  const step=Math.hypot(me.pos.x-ox,me.pos.z-oz);
  if(shield.on){
    let fy=camYaw,bd2=1e9;
    for(const p of projs){
      if(p.owner===myId)continue;const dx=p.m.position.x-me.pos.x,dz=p.m.position.z-me.pos.z,d=Math.hypot(dx,dz);
      if(d<24&&dx*p.v.x+dz*p.v.z<0&&d<bd2){bd2=d;fy=Math.atan2(dx,dz);}
    }
    me.ry+=angDiff(me.ry,fy)*Math.min(1,dt*14);
  }else if(me.speed>.3&&me.throwT<=0){me.ryT=Math.atan2(me.vx,me.vz);me.ry+=angDiff(me.ry,me.ryT)*Math.min(1,dt*12);}
  if(shield.on){shield.en-=45*dt;if(shield.en<=0){shield.en=0;shield.lock=1.2;setShield(false);}}
  else{shield.en=Math.min(100,shield.en+30*dt);shield.lock=Math.max(0,shield.lock-dt);}
  $('#bEn').style.width=shield.en+'%';updateWarn();
  stepD+=step;if(stepD>1.1){stepD=0;sndStep();}
  // 굴리는 눈덩이
  if(rolling){
    const b=rolling;b.dist+=step;b.r=Math.min(1.05,.28+b.dist*.04);
    const f=new V3(Math.sin(me.ry),0,Math.cos(me.ry));
    b.x=me.pos.x+f.x*(b.r+.8);b.z=me.pos.z+f.z*(b.r+.8);
    b.mesh.scale.setScalar(b.r);b.mesh.position.set(b.x,b.r,b.z);
    if(step>.0005){const ax=new V3(me.vz,0,-me.vx).normalize();if(isFinite(ax.x))b.mesh.rotateOnWorldAxis(ax,step/b.r);}
    b.acc+=step;if(b.acc>.35){b.acc=0;stamp(b.x,b.z,b.r);}
  }
  // 캐릭터 애니
  animKid(me,dt);
  for(const b of bots)if(b.active){updateBot(b,dt);animKid(b,dt);}
  updateNet(dt);for(const k of others.values())animKid(k,dt);
  // 투사체
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];p.v.y-=9.8*dt;p.m.position.addScaledVector(p.v,dt);p.life-=dt;
    const pp=p.m.position;
    if(pp.y<.14||p.life<=0){endProj(i);continue;}
    if(p.owner!==myId&&shield.on){
      const f2x=Math.sin(me.ry),f2z=Math.cos(me.ry),sxp=me.pos.x+f2x*.85,szp=me.pos.z+f2z*.85,dx=pp.x-sxp,dz=pp.z-szp;
      if(dx*dx+dz*dz<.85&&pp.y<2&&pp.y>.15&&(p.v.x*f2x+p.v.z*f2z)<0){blockProj(i);continue;}
    }
    if(p.owner!==myId){
      const dx=pp.x-me.pos.x,dz=pp.z-me.pos.z;
      if(dx*dx+dz*dz<.36&&pp.y<1.9){hitMe(i,p.owner);continue;}
    }
    let done=false;
    if(p.owner===myId){
      for(const b of bots){
        if(!b.active)continue;const dx=pp.x-b.pos.x,dz=pp.z-b.pos.z;
        if(dx*dx+dz*dz<.4&&pp.y<1.9){sHit++;score();reactKid(b);b.next=Math.min(b.next,1.5);sndHit();endProj(i);done=true;break;}
      }
      if(done)continue;
    }
    for(const k of others.values()){
      if(k.id===p.owner)continue;const dx=pp.x-k.pos.x,dz=pp.z-k.pos.z;
      if(dx*dx+dz*dz<.4&&pp.y<1.9){sndHit();endProj(i);done=true;break;}
    }
    if(done)continue;
    for(const m of men.values()){
      let y=m.p[0]*.95;
      for(let j=0;j<m.p.length;j++){
        if(j>0)y+=(m.p[j-1]+m.p[j])*.78;
        const dx=pp.x-m.x,dz=pp.z-m.z,dy=pp.y-y;
        if(dx*dx+dz*dz+dy*dy<(m.p[j]+.17)*(m.p[j]+.17)){m.wv+=(dx>0?1:-1)*2.5;sndHit();endProj(i);done=true;break;}
      }
      if(done)break;
    }
  }
  // 눈사람 흔들림
  for(const m of men.values()){m.wv+=(-m.wob*40-m.wv*5)*dt;m.wob+=m.wv*dt;m.g.rotation.z=m.wob*.12;}
  // 가까운 눈사람 선택
  decorT-=dt;
  if(decorT<=0){
    decorT=.2;const n=rolling?null:nearestMan(me.pos.x,me.pos.z,3.2,false);
    if(n!==selMan){selMan=n;refreshTray();}
  }
  // 눈송이·가루
  const px=me.pos.x,pz=me.pos.z,wind=Math.sin(tm*.2)*.5+.6;
  for(let i=0;i<SN;i++){
    let x=snowPos[i*3],y=snowPos[i*3+1],z=snowPos[i*3+2];
    y-=snowVel[i]*dt;x+=(Math.sin(tm*.9+i)*.35+wind)*dt;z+=Math.cos(tm*.7+i*1.3)*.25*dt;
    if(y<0)y+=18;if(x-px>22)x-=44;else if(x-px<-22)x+=44;if(z-pz>22)z-=44;else if(z-pz<-22)z+=44;
    snowPos[i*3]=x;snowPos[i*3+1]=y;snowPos[i*3+2]=z;
  }
  snowGeo.attributes.position.needsUpdate=true;
  for(let i=0;i<PN;i++){
    if(puffLife[i]>0){puffLife[i]-=dt;puffVel[i*3+1]-=9*dt;puffPos[i*3]+=puffVel[i*3]*dt;puffPos[i*3+1]+=puffVel[i*3+1]*dt;puffPos[i*3+2]+=puffVel[i*3+2]*dt;if(puffLife[i]<=0)puffPos[i*3+1]=-100;}
  }
  puffGeo.attributes.position.needsUpdate=true;
  // 카메라
  const cp=Math.cos(camPitch),sp=Math.sin(camPitch),D=7;
  const tx=me.pos.x,ty=1.3,tz=me.pos.z;
  const sx=shake*(Math.random()-.5)*.5,sy=shake*(Math.random()-.5)*.5;
  const so=.85;
  cam.position.set(tx-fx*cp*D+sx-fz*so,Math.max(.6,ty+sp*D+.4)+sy,tz-fz*cp*D+fx*so);
  cam.lookAt(tx+fx*1.5-fz*so,ty+.2,tz+fz*1.5+fx*so);
}
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000||.016);last=now;
  update(dt);renderer.render(scene,cam);
}

/* ---------- 시작 ---------- */
me.vx=0;me.vz=0;
score();
connect();
if(params.get('test'))window.__nm3={me,others,men,projs,bots,rolling:()=>rolling,doThrow,toggleRoll,myId,online:()=>online,hits:()=>sHit,got:()=>sGot,setCam:(y,p)=>{camYaw=y;camPitch=p;},joy:v=>{joyV.x=v[0];joyV.y=v[1];},selMan:()=>selMan,hideIntro,tapAt,setShield,shield,names:()=>[...others.values()].map(k=>k.name),myName:()=>myName,fakeMsg:p=>onMsg(p),blk:()=>sBlk,toScreen,camPos:()=>cam.position};
requestAnimationFrame(frame);
})();
</script>
